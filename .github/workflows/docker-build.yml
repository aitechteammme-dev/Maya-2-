name: Build and push Docker image

# Builds the image (no GPU needed) and pushes it to Docker Hub.
# Required repository secrets (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME   your Docker Hub username
#   DOCKERHUB_TOKEN      a Docker Hub access token (hub.docker.com > Account settings > Personal access tokens)
# Nothing is deployed to RunPod by this workflow.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag"
        default: "v1"
        required: true
      push:
        description: "Push to Docker Hub (false = build only)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - Dockerfile
      - requirements-lock.txt
      - server/**
      - scripts/**
      - config/**
      - .github/workflows/docker-build.yml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space (torch + CUDA layers are large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Decide tag and push
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="sha-${GITHUB_SHA::7}"
          PUSH="${{ github.event.inputs.push }}"
          [ -z "$PUSH" ] && PUSH="true"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "push=$PUSH" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mme-maya2-native:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image size
        if: steps.meta.outputs.push == 'true'
        run: |
          docker buildx imagetools inspect "${{ secrets.DOCKERHUB_USERNAME }}/mme-maya2-native:${{ steps.meta.outputs.tag }}"
